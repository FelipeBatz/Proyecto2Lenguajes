<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reporte de errores léxicos</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 35px;
    font-family: 'Segoe UI', Arial, sans-serif;
    background: #f1f5f9;
    color: #1e293b;
}

.contenedor {
    max-width: 1100px;
    margin: auto;
    background: white;
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 10px 35px rgba(15,23,42,.08);
}

header {
    background: #172033;
    color: white;
    padding: 25px 30px;
}

header h1 {
    margin: 0 0 8px;
    font-size: 25px;
}

header p {
    color: #cbd5e1;
    margin: 0;
}

main {
    padding: 25px 30px;
}

.barra {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 20px;
}

.contador {
    background: #ffedd5;
    color: #c2410c;
    padding: 8px 14px;
    border-radius: 20px;
    font-size: 13px;
    font-weight: 600;
    white-space: nowrap;
}

.tabla-contenedor {
    overflow-x: auto;
    border: 1px solid #e2e8f0;
    border-radius: 10px;
}

table {
    width: 100%;
    border-collapse: collapse;
    text-align: left;
}

thead {
    background: #e8eef5;
}

th {
    padding: 16px;
    color: #334155;
    font-size: 13px;
    white-space: nowrap;
}

td {
    padding: 15px 16px;
    border-top: 1px solid #e2e8f0;
    font-size: 14px;
}

tbody tr:nth-child(even) {
    background: #f8fafc;
}

tbody tr:hover {
    background: #eff6ff;
}

.lexema {
    color: #7c3aed;
    font-family: Consolas, monospace;
    font-weight: 600;
    overflow-wrap: anywhere;
}

.tipo {
    color: #c2410c;
    font-weight: 600;
}

.vacio {
    text-align: center;
    padding: 35px;
    color: #64748b;
}

footer {
    padding: 18px 30px;
    border-top: 1px solid #e2e8f0;
    color: #64748b;
    font-size: 12px;
}

@media (max-width: 600px) {
    body {
        padding: 12px;
    }

    main {
        padding: 18px;
    }

    header {
        padding: 22px;
    }
}
</style>
</head>

<body>
<div class="contenedor">

<header>
    <h1>Reporte de errores léxicos</h1>
    <p>Caracteres y lexemas no reconocidos durante el análisis</p>
</header>

<main>
    <div class="barra">
        <h2>Listado de errores</h2>
        <span class="contador">
0 errores léxicos        </span>
    </div>

    <div class="tabla-contenedor">
    <table>
    <thead>
    <tr>
        <th>No.</th>
        <th>Lexema</th>
        <th>Tipo</th>
        <th>Fila</th>
        <th>Columna</th>
    </tr>
    </thead>
    <tbody>
<tr>
    <td colspan="5" class="vacio">
        No hay errores léxicos registrados.
    </td>
</tr>
    </tbody>
    </table>
    </div>
</main>

<footer>
    Reporte generado por el analizador léxico.
</footer>

</div>
</body>
</html>
